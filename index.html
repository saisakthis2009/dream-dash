
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Dash - Magical Space Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌌 DREAM DASH</h1>
        <p>Explore the galaxy, collect crystals and dodge space rocks!</p>
    </header>

    <main>

        <div class="game-info">
            <h2>Space Adventure</h2>
            <p>Press SPACE to jump and begin your journey!</p>
        </div>

        <canvas id="gameCanvas" width="800" height="300">
            Your browser does not support HTML Canvas.
        </canvas>

        <div class="score-board">
            <h3 id="score">Score: 0</h3>
        </div>

        <button id="restartBtn">Restart Adventure ↻</button>

    </main>

    <footer>
        <p>✨ Travel beyond the stars ✨</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
